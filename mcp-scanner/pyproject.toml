[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sec"
version = "0.1.0"
description = "Offline security scanner for MCP configuration files"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcp-sec = "mcp_scanner:main"

[tool.setuptools]
py-modules = ["mcp_scanner"]
